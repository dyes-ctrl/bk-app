name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/bk.jks" \
            -alias bk -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass bkstorepass -keypass bkkeypass \
            -dname "CN=BK, OU=BK, O=BK, L=NA, ST=NA, C=FR"

      - name: Sign APK
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          echo "Using build-tools: $BT"
          UNSIGNED=app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/zipalign" -v -p 4 "$UNSIGNED" bk-aligned.apk
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/bk.jks" --ks-key-alias bk \
            --ks-pass pass:bkstorepass --key-pass pass:bkkeypass \
            --out bk-release-signed.apk bk-aligned.apk
          "$BT/apksigner" verify --verbose bk-release-signed.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BK-release-signed-apk
          path: bk-release-signed.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: build-${{ github.run_number }}
          name: "BK App — Build #${{ github.run_number }} (signé)"
          body: |
            Build automatique signé — commit ${{ github.sha }}

            APK signé (installable). Mécanisme applicatif inchangé vs build #19 :
            - Blocage via CallScreeningService (zéro sonnerie, cross-brand EMUI/MIUI)
            - CallInterceptor priorité max en filet de secours
            - Cache whitelist en mémoire (zéro I/O sur le chemin d'appel)
          files: bk-release-signed.apk
          draft: false
          prerelease: false
